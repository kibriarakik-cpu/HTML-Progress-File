<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array File</title>
</head>
<body>
    <style>
        body {
            background-color: lightyellow;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
        }
    </style>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <p>Array Methods</p>
    <script>
var student = {
    name: 'Riya',
    age: '12',
    Grade: '7',
    hobbies: 'Drawing',
    fav_sport: 'Cricket'
};
var color = ["white", "black", "red", "green", "blue"];
document.write("Student name is : " + student.name,
"<br>","Student favorite sport is : "
+student.fav_sport);
document.write("<br>Before Poping the colors are: " + color.join("^"));
document.write("<br>My favorite color is : " + color[3]);
color.pop();
document.write("<br>After Poping the colors are : " + color.join("*"));
//array
let a =["Argentina","Brazil","France","Portugal","Spain"];
//object
a.push("Italy");

a.pop("Germany");
console.log(a)
    </script>
    

</body>
</html>
