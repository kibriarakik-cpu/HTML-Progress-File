<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argument Methods</title>
</head>
<body>
    <style>
        body {
            background-color: lightyellow;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
        }
    </style>
    <p>Sum of arguments and Math objects </p>
<p id="demo"></p>
    <script>
        function sum() {
            let total = 0;
            for (let i = 0; i < arguments.length; i++) {
                total += arguments[i];
            }
            return total;
        }

        const result = sum(5, 10, 15);
        document.getElementById("demo").innerText = `The sum of the arguments is: ${result}`;
      document.getElementById("demo").innerHTML = sum(1, 123, 500, 115, 44, 88);
        var value = Math.sin(45);
document.write("Sin 45 is : " + value + "<br>");
var value1 = Math.cos(45);
document.write("Cos 45 is : " + value1 + "<br>");
var value2 = Math.tan(45);
document.write("Tan 45 is : " + value2 + "<br>");
    </script>
    

</body>
</html>
