<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>
    #body {
        background-color: aquamarine;
        color: white;
    }
    #input {
        color:cadetblue;
        font-family: 'italic';
        font-size: 20px;
        font-weight: normal;
        border: 5px solid navy;
    }
 

    
    #ul {
        color:olive;
        font-family: 'italic';
        font-size: 20px;
        font-weight: normal;
        border: 5px dashed navy;
    }
    #div {
        background-color: lightgray;
        color: green;
        height: 500px;
      width: 300px;
      border: 3px dashed aquamarine;
      
  
    }
    div:hover {
        background-color: lightgray;
        color: green;
        height: 500px;
      width: 300px;
      border: 3px dashed aquamarine;
 
    }
    ul>li :nth-child(2) {
        color: blue;
        font-family: 'italic';
        font-size: 20px;
        font-weight: normal; 
    }
    ul>li :nth-child(2) {
        color: blue;
        font-family: 'italic';
        font-size: 20px;
        font-weight: normal;
    }
    
</style>
  <input type="text" id="input"><h5>This is an input field</h5></input>
  <h1>This is a Pseudo-element</h1>
<ul id="ul">
    <li>Pagani</li>
    <li>GT-R</li>
    <li>Lamborghini</li>
     <li>Alpha Romeo</li>
</ul> 
<div id="div">This is a div</div>

</body>
</html>
