<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Documentation</title>

    <!-- Bootstrap CDN -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
    <div class="container bg-success text-white p-5">
        <h1>Container Documentation</h1>
        <p>This is a simple example of a Bootstrap container.</p>
        <button class="btn btn-primary">Test Button</button>
    </div><br>
    <div class="container-fluid bg-success text-white p-5">
        <h1>Container Documentation</h1>
        <p>This is a simple example of a Bootstrap container.</p>
        <button class="btn btn-primary">Test Button</button>
    </div>
    <div class="container border border-dark p-3 my-3">
        <p>This is another Bootstrap container with a border.</p>
    </div>
    <div class="container p-5 mb-5 bg-primary text-white">
        <h2>Another Container</h2>
        <p>This container has padding and a background color.</p>
    </div>

</html>
