<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>
<body>
    <style>
        body {
            background-color: seagreen;
        }
        .col {
            background-color:aquamarine;
           border: 3px dashed darkblue;
            height: 100px;
            text-align: center;
            line-height: 100px;
        }
        h3 {
            color: red;
            text-align: center;
        }
        </style>
<h3 id="h3">Columns in grid</h3>
<div class="container">
    <div class="row">
        <div class="col">Argon</div>
        <div class="col">Calcium</div>
        <div class="col">Sodium</div>
        <div class="col">Potassium</div>
</div><br>
<div class="container">
    <!--Small, Medium, Large -->
    <div class="row">
        <div class="col-md-8 col-xs-4" style="background-color: aqua;">Column 1</div>
        <div class="col-md-12 col-xs-8" style="background-color: black;">Column 2</div>
        <div class="col-md-12 col-xs-12" style="background-color:aquamarine;">Column 3</div>
        <div class="col-md-12 col-xs-12" style="background-color: lightcoral;">Column 4</div>
       
    </div>
    <div class="col-md-9 col-xs-12" style="background-color: lightgreen;">Column 5</div>
    <div class="col-md-3 col-xs-12" style="background-color: lightblue;">Column 6</div>
    <div class="col-md-4 col-xs-12" style="background-color: lightpink;">Column 7</div>
    <div class="col-md-4 col-xs-12" style="background-color: lightyellow;">Column 8</div>
    <div class="col-md-4 col-xs-12" style="background-color: lightgray;">Column 9</div>
</div>
    <script src="./script.js"></script>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/t0Q2otsqC4I?si=vRFvFzcZrwJDmU4C" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
