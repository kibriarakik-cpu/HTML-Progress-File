<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

<body>
    <style>
        body {
            background-color: seagreen;
        }
        .col {
            background-color:aquamarine;
           border: 3px dashed darkblue;
            height: 100px;
            text-align: center;
            line-height: 100px;
        }
        h3 {
            color: red;
            text-align: center;
        }
        </style>
<h3 id="h3">Columns in grid</h3>
<div class="container">
    <div class="row">
        <div class="col">Argon</div>
        <div class="col">Calcium</div>
        <div class="col">Sodium</div>
        <div class="col">Potassium</div>
</div><br>
<div class="container">
    <!--Small, Medium, Large -->
    <div class="row">
        <div class="col-sm">Argon</div>
        <div class="col-md">Calcium</div>
        <div class="col-lg">Sodium</div>
        <div class="col-xl">Potassium</div>
    </div>
</div>
